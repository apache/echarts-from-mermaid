github:
  description: Apache ECharts From Mermaid
  homepage: https://github.com/apache/echarts-from-mermaid
  labels:
    - mermaid
    - echarts
    - apache
    - data-visualization

  rulesets:
    - name: "Default Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "release/*"
          - "rel/*"
        excludes: []
      bypass_teams:
        - root
      restrict_deletion: true
      restrict_force_push: true
notifications:
  commits: commits@echarts.apache.org
  pullrequests: commits@echarts.apache.org
  issues: commits@echarts.apache.org
